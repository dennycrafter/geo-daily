name: Pull GeoGuessr scores

on:
  schedule:
    # GitHub uses UTC. Austin is UTC-6 in winter (UTC-5 in summer, so these shift an hour).
    - cron: "*/5 15-22 * * *"        # every 5 min, 9am to 5pm Austin
    - cron: "0 0-14,23 * * *"        # every hour the rest of the day
  workflow_dispatch: {}       # "Run workflow" button for a manual pull

permissions:
  contents: write

concurrency:
  group: fetch-scores
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull scores
        env:
          GEO_NCFA: ${{ secrets.GEO_NCFA }}
          GEO_BOT_NCFA: ${{ secrets.GEO_BOT_NCFA }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/fetch.mjs
      - name: Save if anything changed
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No new scores."
          else
            git config user.name "geo-daily bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update scores"
            git pull --rebase -q || true
            git push
          fi
