name: Pull GeoGuessr scores

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # "Run workflow" button for a manual pull

permissions:
  contents: write

concurrency:
  group: fetch-scores
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull scores
        env:
          GEO_NCFA: ${{ secrets.GEO_NCFA }}
        run: node scripts/fetch.mjs
      - name: Save if anything changed
        run: |
          if git diff --quiet -- data/scores.json; then
            echo "No new scores."
          else
            git config user.name "geo-daily bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/scores.json
            git commit -m "Update scores"
            git push
          fi
